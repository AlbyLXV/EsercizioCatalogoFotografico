<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Catalogo Fotografico</title>
<style>
	body {
		margin: 20px;
		font-family: Arial;
	}


	#container {
		width: 360px;
		margin: 0 auto;
	}


	form {
		background-color: #000066;
		padding: 2px 12px;
		display: inline-block;
	}


	button {
		background-color: #000066;
		color: #ffffff;
		border: none;
		padding: 4px 10px;
		font-weight: bold;
		height:30px;
		vertical-align: middle;
	}


	select {
		background-color: #ffffff;
		color: #000066;
		border: 1px solid #000066;
		padding: 3px 12px;
		font-weight: bold;
		display: inline-block;
		width:210px;
		height:30px;
		vertical-align: middle;
	}


	#box {
		width: 360px;
		height: 360px;
		margin: 8px auto 0 auto;
		border: 2px solid #000066;
		background-color: #ffffff;
		align-items: center;
		justify-content: center;
		overflow: hidden;
		display: none;
	}


	#box img {
		width: 100%;
		height: 100%;
		object-fit: contain;
		display: block;
	}
</style>
</head>
<body>
	<div id="container">
		<form name="immagine">
		<button type="button" onclick="precedente()">Prec.</button>
		<select name="sito" id="scegliFoto">
			<option selected disabled>Seleziona un personaggio</option>
			<option value="0">Luffy</option>
			<option value="1">Ace</option>
			<option value="2">Barbanera</option>
			<option value="3">Chopper</option>
			<option value="4">Doflamingo</option>
			<option value="5">Imu</option>
			<option value="6">Kaido</option>
			<option value="7">Nami</option>
			<option value="8">Nico Robin</option>
			<option value="9">Sanji</option>
			<option value="10">Zoro</option>
		</select>
			<button type="button" onclick="successivo()">Succ.</button>
		</form>
		<div id="box"></div>
	</div>
	<script>
		let personaggi = [
			"luffy.avif",
			"ace.png",
			"Barbanera.png",
			"chopper.webp",
			"doflamingo.webp",
			"imu.jpeg",
			"kaido.webp",
			"nami.webp",
			"nico.webp",
			"sanji.webp",
			"zoro.webp"
		];

		let img;

		document.getElementById("scegliFoto").addEventListener("change", apri);

		function apri() {
			img = document.immagine.sito.value;

			for (let i = 0; i < personaggi.length; i++) {
				if (personaggi[i] == img) {
					img = i;
				}
			}

			let box = document.getElementById("box");
			box.style.display = "block";
			box.innerHTML = "<img src='" + personaggi[img] + "'/>";
		}
		
		function successivo() {
			if (img < personaggi.length -1) {
				img++;
			} else {
				img = 0;
			} 
		 document.immagine.sito.value = personaggi[img];
		 apri();
		}
		
		function precedente() {
			if (img > 0) {
				img--;
			} else {
				img = personaggi.length -1;
			} 
			document.immagine.sito.value = personaggi[img];
			apri();
		}
		
		
	  </script>
</body>
</html>
